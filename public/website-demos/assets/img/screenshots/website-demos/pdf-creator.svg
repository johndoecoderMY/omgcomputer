  <text x="34" y="446" fill="#68747f" font-family="Arial,sans-serif" font-size="9">A responsive page with menu, hours,</text>
  <text x="34" y="461" fill="#68747f" font-family="Arial,sans-serif" font-size="9">location, and accessible typography.</text>
