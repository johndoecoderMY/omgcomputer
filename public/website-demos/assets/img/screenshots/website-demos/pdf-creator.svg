  <text x="514" y="379" fill="#74808b" font-family="Arial,sans-serif" font-size="9">Prepared by Jamie Tan</text>
  <text x="990" y="379" fill="#74808b" font-family="Arial,sans-serif" font-size="9" text-anchor="end">15 November 2026</text>
  <text x="514" y="431" fill="#37434e" font-family="Arial,sans-serif" font-size="11" font-weight="700">Project overview</text>
  <text x="514" y="454" fill="#37434e" font-family="Arial,sans-serif" font-size="10">Northstar Coffee is ready for a clearer, more welcoming online</text>
  <text x="514" y="471" fill="#37434e" font-family="Arial,sans-serif" font-size="10">presence. This proposal outlines a refreshed website that helps</text>
  <text x="514" y="488" fill="#37434e" font-family="Arial,sans-serif" font-size="10">customers discover the menu, find the cafe, and learn its story.</text>
  <text x="514" y="529" fill="#37434e" font-family="Arial,sans-serif" font-size="11" font-weight="700">Recommended approach</text>
  <text x="514" y="552" fill="#37434e" font-family="Arial,sans-serif" font-size="10">We will create a responsive landing page with an easy-to-scan</text>
  <text x="514" y="569" fill="#37434e" font-family="Arial,sans-serif" font-size="10">menu, opening hours, location details, and a simple enquiry path.</text>
  <text x="514" y="610" fill="#37434e" font-family="Arial,sans-serif" font-size="11" font-weight="700">Next steps</text>
  <text x="514" y="633" fill="#37434e" font-family="Arial,sans-serif" font-size="10">Once the direction is approved, we can confirm timeline and scope.</text>
