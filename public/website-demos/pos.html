<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter — Point of sale demo</title>
  <style>
    :root{--ink:#252c29;--muted:#818982;--line:#e7eae6;--green:#315f49;--pale:#f4f6f2;--orange:#e7a255}
    *{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:var(--ink);font:14px/1.4 Arial,sans-serif}
    button{font:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr) 340px}
    aside{background:#fff;border-right:1px solid var(--line);padding:24px 16px}.logo{font-size:19px;font-weight:800;letter-spacing:-.04em;padding:0 12px 30px}.logo span{color:var(--green)}
    .label{padding:12px;color:#a0a8a2;font-size:10px;font-weight:bold;letter-spacing:.13em;text-transform:uppercase}.nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:9px;color:#68716b;margin:3px 0}.nav.active{background:#eaf1ec;color:var(--green);font-weight:bold}
    .main{padding:28px 30px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.topbar h1{font-size:25px;margin:0}.topbar p{margin:4px 0 0;color:var(--muted)}.badge{background:#e8f2eb;color:var(--green);border-radius:20px;padding:8px 12px;font-size:12px;font-weight:bold}
    .search{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:13px 15px;margin-bottom:20px;font-size:14px}.categories{display:flex;gap:9px;overflow:auto;padding-bottom:20px}
    .category{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 15px;white-space:nowrap;color:#5a625c}.category.selected{background:var(--green);border-color:var(--green);color:white}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.product{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;text-align:left;color:inherit}.product:hover{border-color:var(--green);box-shadow:0 5px 16px #27493413}
    .food{height:100px;border-radius:8px;background:var(--pale);display:grid;place-items:center;font-size:38px;margin-bottom:12px}.product strong{display:block}.product small{display:block;color:var(--muted);margin:4px 0 10px}.price{color:var(--green);font-weight:bold}
    .order{background:white;border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;min-height:100vh}.order-title{display:flex;justify-content:space-between;align-items:center}.order h2{font-size:20px;margin:0}.table{font-size:12px;color:var(--muted);margin-top:5px}.order-items{flex:1;overflow:auto;padding-top:16px}.empty{text-align:center;color:var(--muted);padding:50px 0}.line-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:15px 0;border-bottom:1px solid var(--line)}.line-item small{display:block;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;gap:9px;margin-top:9px}.qty button{width:24px;height:24px;border:1px solid var(--line);background:white;border-radius:6px}.totals{border-top:1px solid var(--line);padding-top:14px}.total-row{display:flex;justify-content:space-between;padding:6px 0;color:#69726c}.total-row.final{color:var(--ink);font-size:18px;font-weight:bold;margin:5px 0 10px}.checkout{border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:bold;padding:15px;width:100%}.checkout:disabled{opacity:.45;cursor:not-allowed}
    @media(max-width:950px){.app{grid-template-columns:72px minmax(0,1fr) 300px}aside{padding:22px 10px}.logo{font-size:0;text-align:center;padding:0 0 30px}.logo:first-letter{font-size:20px}.nav{justify-content:center;font-size:0}.label{font-size:0;padding:8px}}
    @media(max-width:680px){.app{display:block}.app>aside{display:none}.main{padding:22px 16px}.order{min-height:unset;border-left:0;border-top:1px solid var(--line);padding:20px 16px}.order-items{max-height:260px;min-height:60px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div class="app">
    <aside><div class="logo">c<span>o</span>unter</div><div class="label">Workspace</div><div class="nav active">▦ &nbsp; Register</div><div class="nav">▤ &nbsp; Orders</div><div class="nav">▧ &nbsp; Products</div><div class="nav">◷ &nbsp; Reports</div><div class="label">Account</div><div class="nav">⚙ &nbsp; Settings</div></aside>
    <main class="main">
      <div class="topbar"><div><h1>New order</h1><p>Tuesday, October 14 · Register 01</p></div><span class="badge">● Register open</span></div>
      <input class="search" type="search" id="search" placeholder="⌕  Search menu items…" aria-label="Search menu items">
      <div class="categories" id="categories"><button class="category selected" data-category="All">All items</button><button class="category" data-category="Coffee">Coffee</button><button class="category" data-category="Bakery">Bakery</button><button class="category" data-category="Lunch">Lunch</button></div>
      <div class="products" id="products"></div>
    </main>
    <section class="order" aria-label="Current order">
      <div class="order-title"><div><h2>Current order</h2><div class="table">Walk-in · Table 04</div></div><span id="itemCount">0 items</span></div>
      <div class="order-items" id="orderItems"><div class="empty">Add an item to get started</div></div>
      <div class="totals"><div class="total-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div><div class="total-row"><span>Tax (8%)</span><span id="tax">$0.00</span></div><div class="total-row final"><span>Total</span><span id="total">$0.00</span></div><button class="checkout" id="checkout" disabled>Charge $0.00</button></div>
    </section>
  </div>
  <script>
    const menu=[{id:1,name:'House latte',detail:'12 oz · Oat available',price:4.5,category:'Coffee',icon:'☕'},{id:2,name:'Flat white',detail:'Double espresso',price:4,category:'Coffee',icon:'🥛'},{id:3,name:'Cold brew',detail:'Slow steeped',price:4.75,category:'Coffee',icon:'🧊'},{id:4,name:'Butter croissant',detail:'Baked this morning',price:3.5,category:'Bakery',icon:'🥐'},{id:5,name:'Blueberry muffin',detail:'Wild blueberry',price:3.25,category:'Bakery',icon:'🧁'},{id:6,name:'Avocado toast',detail:'Sourdough · chili oil',price:11,category:'Lunch',icon:'🥑'},{id:7,name:'Market salad',detail:'Seasonal vegetables',price:12.5,category:'Lunch',icon:'🥗'},{id:8,name:'Banana bread',detail:'Walnut · toasted',price:4,category:'Bakery',icon:'🍞'}];
    const cart={};let activeCategory='All';const money=n=>'$'+n.toFixed(2);
    function renderProducts(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('products').innerHTML=menu.filter(p=>(activeCategory==='All'||p.category===activeCategory)&&p.name.toLowerCase().includes(q)).map(p=>`<button class="product" data-id="${p.id}"><span class="food">${p.icon}</span><strong>${p.name}</strong><small>${p.detail}</small><span class="price">${money(p.price)}</span></button>`).join('');}
    function renderCart(){const entries=menu.filter(p=>cart[p.id]);const count=entries.reduce((n,p)=>n+cart[p.id],0);const subtotal=entries.reduce((n,p)=>n+p.price*cart[p.id],0);document.getElementById('itemCount').textContent=count+' '+(count===1?'item':'items');document.getElementById('orderItems').innerHTML=entries.length?entries.map(p=>`<div class="line-item"><div><strong>${p.name}</strong><small>${money(p.price)} each</small><div class="qty"><button data-change="-1" data-id="${p.id}" aria-label="Remove one ${p.name}">−</button><span>${cart[p.id]}</span><button data-change="1" data-id="${p.id}" aria-label="Add one ${p.name}">+</button></div></div><strong>${money(p.price*cart[p.id])}</strong></div>`).join(''):'<div class="empty">Add an item to get started</div>';document.getElementById('subtotal').textContent=money(subtotal);document.getElementById('tax').textContent=money(subtotal*.08);document.getElementById('total').textContent=money(subtotal*1.08);const checkout=document.getElementById('checkout');checkout.disabled=!count;checkout.textContent='Charge '+money(subtotal*1.08);}
    document.getElementById('categories').addEventListener('click',e=>{const b=e.target.closest('button[data-category]');if(!b)return;activeCategory=b.dataset.category;document.querySelectorAll('.category').forEach(x=>x.classList.toggle('selected',x===b));renderProducts();});
    document.getElementById('search').addEventListener('input',renderProducts);
    document.getElementById('products').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b){const id=Number(b.dataset.id);cart[id]=(cart[id]||0)+1;renderCart();}});
    document.getElementById('orderItems').addEventListener('click',e=>{const b=e.target.closest('button[data-change]');if(!b)return;const id=Number(b.dataset.id);cart[id]+=Number(b.dataset.change);if(cart[id]<=0)delete cart[id];renderCart();});
    document.getElementById('checkout').addEventListener('click',()=>{if(!Object.keys(cart).length)return;const total=document.getElementById('total').textContent;window.alert('Demo checkout complete — '+total+' charged.');Object.keys(cart).forEach(id=>delete cart[id]);renderCart();});
    renderProducts();renderCart();
  </script>
</body>
</html>
