<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f34303">
    <title>You're offline | OMG Computer</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
            background: #101b2a;
            color: #f5f7fa;
        }

        body {
            box-sizing: border-box;
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            place-items: center;
        }

        main {
            max-width: 32rem;
            padding: 2rem;
            border: 1px solid #344256;
            border-radius: 1rem;
            background: #182638;
            text-align: center;
        }

        h1 {
            color: #ff5a1f;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            padding: .7rem 1rem;
            border-radius: .5rem;
            background: #f34303;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Reconnect to continue. For your privacy, account pages and customer information are not available offline.</p>
        <a href="/dashboard">Try again</a>
    </main>
</body>
</html>
