<svg xmlns="http://www.w3.org/2000/svg" width="48in" height="24in" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">OMG Computer horizontal banner design example</title>
  <desc id="description">A navy and orange print banner featuring the OMG Computer logo, computer repair services, and verified contact details.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1929"/>
      <stop offset="1" stop-color="#101f31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b13"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#background)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <rect width="1600" height="12" fill="url(#accent)"/>
  <circle cx="1480" cy="80" r="220" fill="#ff5a19" opacity=".045"/>
  <circle cx="1500" cy="790" r="300" fill="#ffb31a" opacity=".035"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(88 64)">
      <image href="public/bimi/logo.svg" width="76" height="76"/>
      <text x="96" y="34" fill="#fff" font-size="31" font-weight="800" letter-spacing="1">OMG COMPUTER</text>
      <text x="97" y="62" fill="#a9bed5" font-size="17" font-weight="700" letter-spacing="3">REPAIR · SUPPORT · WEB</text>
    </g>

    <text x="92" y="250" fill="#ff6424" font-size="22" font-weight="800" letter-spacing="4">STRAIGHTFORWARD LOCAL SUPPORT</text>
    <text x="88" y="365" fill="#fff" font-size="91" font-weight="800" letter-spacing="-2">COMPUTER TROUBLE?</text>
    <text x="88" y="475" fill="#ff6424" font-size="104" font-weight="800" letter-spacing="-2">WE’LL FIX IT.</text>
    <text x="94" y="542" fill="#c4d2e2" font-size="30" font-weight="400">Clear advice. Practical repairs. No jargon.</text>

    <g transform="translate(94 602)">
      <rect width="922" height="2" fill="#fff" opacity=".15"/>
      <circle cx="12" cy="54" r="6" fill="#ffb31a"/>
      <text x="34" y="63" fill="#fff" font-size="25" font-weight="700">PC REPAIR</text>
      <circle cx="250" cy="54" r="6" fill="#ffb31a"/>
      <text x="272" y="63" fill="#fff" font-size="25" font-weight="700">UPGRADES</text>
      <circle cx="506" cy="54" r="6" fill="#ffb31a"/>
      <text x="528" y="63" fill="#fff" font-size="25" font-weight="700">CUSTOM WEBSITES</text>
    </g>

    <rect x="1080" y="172" width="440" height="500" rx="28" fill="#13263a" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <text x="1300" y="225" text-anchor="middle" fill="#ffb31a" font-size="20" font-weight="800" letter-spacing="3">GET IN TOUCH</text>
    <text x="1300" y="280" text-anchor="middle" fill="#fff" font-size="29" font-weight="800">WhatsApp or call</text>
    <text x="1300" y="348" text-anchor="middle" fill="#ff6424" font-size="39" font-weight="800">+60 10-422 4350</text>
    <rect x="1160" y="384" width="280" height="2" fill="#fff" opacity=".15"/>
    <text x="1300" y="445" text-anchor="middle" fill="#c4d2e2" font-size="17">EMAIL</text>
    <text x="1300" y="477" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">support@omgcomputer.my</text>
    <text x="1300" y="535" text-anchor="middle" fill="#c4d2e2" font-size="17">VISIT OUR WEBSITE</text>
    <text x="1300" y="578" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">omgcomputer.my</text>
    <rect x="1170" y="603" width="260" height="2" fill="#ff6424" opacity=".7"/>

    <text x="92" y="744" fill="#9eb2c8" font-size="20" font-weight="700" letter-spacing="1">OMGCOMPUTER.MY</text>
    <text x="1508" y="744" text-anchor="end" fill="#8197ae" font-size="16">COMPUTER REPAIR · UPGRADES · WEBSITE DESIGN</text>
  </g>
</svg>
