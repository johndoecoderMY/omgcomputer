<svg xmlns="http://www.w3.org/2000/svg" width="48in" height="24in" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">OMG Computer horizontal banner design example</title>
  <desc id="description">A navy and orange banner promoting computer repairs, upgrades, and custom websites, with a WhatsApp contact and a clearly marked QR placeholder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1929"/>
      <stop offset="1" stop-color="#101f31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b13"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#background)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <rect width="1600" height="12" fill="url(#accent)"/>
  <circle cx="1480" cy="80" r="220" fill="#ff5a19" opacity=".045"/>
  <circle cx="1500" cy="790" r="300" fill="#ffb31a" opacity=".035"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(88 64)">
      <rect width="76" height="76" rx="18" fill="url(#accent)"/>
      <path d="M22 28h32v24H22zM28 58h20M38 52v6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="34" fill="#fff" font-size="31" font-weight="800" letter-spacing="1">OMG COMPUTER</text>
      <text x="97" y="62" fill="#a9bed5" font-size="17" font-weight="700" letter-spacing="3">REPAIR · SUPPORT · WEB</text>
    </g>

    <text x="92" y="250" fill="#ff6424" font-size="22" font-weight="800" letter-spacing="4">STRAIGHTFORWARD LOCAL SUPPORT</text>
    <text x="88" y="365" fill="#fff" font-size="91" font-weight="800" letter-spacing="-2">COMPUTER TROUBLE?</text>
    <text x="88" y="475" fill="#ff6424" font-size="104" font-weight="800" letter-spacing="-2">WE’LL FIX IT.</text>
    <text x="94" y="542" fill="#c4d2e2" font-size="30" font-weight="400">Clear advice. Practical repairs. No jargon.</text>

    <g transform="translate(94 602)">
      <rect width="922" height="2" fill="#fff" opacity=".15"/>
      <circle cx="12" cy="54" r="6" fill="#ffb31a"/>
      <text x="34" y="63" fill="#fff" font-size="25" font-weight="700">PC REPAIR</text>
      <circle cx="250" cy="54" r="6" fill="#ffb31a"/>
      <text x="272" y="63" fill="#fff" font-size="25" font-weight="700">UPGRADES</text>
      <circle cx="506" cy="54" r="6" fill="#ffb31a"/>
      <text x="528" y="63" fill="#fff" font-size="25" font-weight="700">CUSTOM WEBSITES</text>
    </g>

    <rect x="1080" y="172" width="440" height="500" rx="28" fill="#13263a" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <text x="1300" y="225" text-anchor="middle" fill="#ffb31a" font-size="20" font-weight="800" letter-spacing="3">NEED A HAND?</text>
    <text x="1300" y="269" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">Message us on WhatsApp</text>

    <rect x="1195" y="300" width="210" height="210" rx="14" fill="#fff"/>
    <g fill="#13263a">
      <path d="M1215 320h54v54h-54zM1230 335v24h24v-24zM1341 320h44v44h-44zM1353 332v20h20v-20zM1215 431h54v59h-54zM1230 446v29h24v-29z"/>
      <path d="M1284 320h12v12h-12zM1308 332h12v12h-12zM1284 356h12v12h-12zM1308 368h12v12h-12zM1284 392h12v12h-12zM1320 392h12v12h-12zM1296 416h12v12h-12zM1320 428h12v12h-12zM1284 452h12v12h-12zM1308 464h12v12h-12zM1344 380h12v12h-12zM1368 380h12v12h-12zM1380 404h12v12h-12zM1344 428h12v12h-12zM1368 452h12v12h-12zM1380 476h12v12h-12z"/>
    </g>
    <rect x="1212" y="480" width="176" height="23" rx="5" fill="#fff"/>
    <text x="1300" y="497" text-anchor="middle" fill="#ff4b13" font-size="13" font-weight="800" letter-spacing="1.5">QR PLACEHOLDER</text>

    <text x="1300" y="555" text-anchor="middle" fill="#c4d2e2" font-size="17">Replace with a tested WhatsApp QR</text>
    <rect x="1140" y="578" width="320" height="62" rx="31" fill="url(#accent)"/>
    <path d="M1180 600c0-8 7-14 15-14 4 0 8 2 11 5l-6 7c-2-2-3-3-5-3-3 0-5 2-5 5s2 5 5 5c2 0 4-1 6-3l6 7c-3 3-7 5-12 5-8 0-15-6-15-14z" fill="#fff"/>
    <text x="1310" y="588" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" letter-spacing="1">WHATSAPP</text>
    <text x="1310" y="621" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">+60 10-422 4350</text>

    <text x="92" y="744" fill="#9eb2c8" font-size="20" font-weight="700" letter-spacing="1">OMGCOMPUTER.MY</text>
    <text x="1508" y="744" text-anchor="end" fill="#8197ae" font-size="16">COMPUTER REPAIR · UPGRADES · WEBSITE DESIGN</text>
  </g>
</svg>
